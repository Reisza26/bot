services:
  - type: web
    name: xp-bot
    env: python
    plan: free # 7/24 + kalici XP icin Starter (7$) ve disk gerekli
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: xp.db # Starter + disk kullaniyorsan /data/xp.db yap
    healthCheckPath: /
    # Kalici XP icin (free'de XP her restart'ta silinir!):
    # Starter plana gecince alt satirlari ac:
    # disk:
    #   name: xp-data
    #   mountPath: /data
    #   sizeGB: 1
  - type: web
    name: welcome-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python welcome_bot.py
    envVars:
      - key: WELCOME_BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /
